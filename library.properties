sentence=Driver for the Analog Devices ADRF6655 broadband up/downconverting mixer with integrated fractional-N PLL and VCO.
paragraph=Provides one configuration function per register (R0-R7), a single low-level SPI write primitive, automatic INT/MOD/FRAC calculation from a target LO frequency, and the full deactivate->reconfigure->activate sequence required on every frequency change. Designed for ESP32 control of the ADRF6655 evaluation board over SPI.
